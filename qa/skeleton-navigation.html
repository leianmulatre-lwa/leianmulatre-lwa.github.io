/* BIGLWA login + Studio routing */
.route-screen{display:none}
.route-screen.is-active{display:block}
.login-page{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,236,224,.96),transparent 28%),
    radial-gradient(circle at 78% 28%,rgba(213,116,116,.38),transparent 34%),
    linear-gradient(135deg,#f3d8c9 0%,#c87473 42%,#5c4547 76%,#252222 100%);
  color:#171515;
}
.login-page::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.2;
  pointer-events:none;
  background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.65) 0 1px,transparent 1.5px);
  background-size:18px 18px;
  mix-blend-mode:soft-light;
}
.login-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(390px,.75fr);
  position:relative;
  z-index:1;
}
.login-stage{
  padding:34px 7vw 54px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:100vh;
}

.login-brand-row,.studio-brand-row{display:flex;align-items:center;gap:14px;min-width:max-content}
.window-lights{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.window-light{width:11px;height:11px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.12)}
.window-light.red{background:#df5b55}
.window-light.yellow{background:#e1bf4f}
.window-light.green{background:#559a61}
.studio-brand-row{height:100%}
.studio-brand-row .window-lights{margin-right:2px}
.login-username-help{display:block;margin:-4px 0 12px;font-size:10px;line-height:1.45;color:#81766f}
.login-username-help strong{font-weight:700;color:#6d625c}
.login-brand{
  font-family:Georgia,"Times New Roman",serif;
  font-size:48px;
  line-height:.9;
  letter-spacing:-4px;
  text-decoration:none;
  color:#171515;
  width:max-content;
}
.login-copy{max-width:690px;margin:13vh 0 10vh}
.login-overline{font-size:11px;letter-spacing:2.8px;text-transform:uppercase;margin:0 0 16px;color:#514543}
.login-copy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(58px,7.2vw,112px);line-height:.82;letter-spacing:-5px;margin:0;max-width:760px;font-weight:500}
.login-copy h1 em{font-weight:400;color:#fff7ef;text-shadow:0 3px 20px rgba(46,27,26,.15)}
.login-copy p{max-width:510px;font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.35;margin:28px 0 0;color:#332b2b}
.login-foot{display:flex;gap:18px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#554b48}
.login-foot i{width:52px;height:1px;background:currentColor;display:block}
.login-panel-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px 5vw 34px 2vw;
  min-height:100vh;
}
.login-card{
  width:min(450px,100%);
  padding:28px 28px 24px;
  border-radius:22px;
  background:rgba(250,247,241,.88);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:0 26px 80px rgba(29,18,18,.24);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}
.login-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
.login-card-head h2{font-family:Georgia,"Times New Roman",serif;font-size:32px;letter-spacing:-1.2px;margin:0}
.login-card-head p{font-size:11px;line-height:1.35;color:#756b65;margin:4px 0 0}
.login-status-dot{width:10px;height:10px;border-radius:50%;background:rgb(var(--aura-rgb,216,95,109));box-shadow:0 0 18px rgba(var(--aura-rgb,216,95,109),.7);margin-top:8px;flex:0 0 auto}
.login-tabs{display:grid;grid-template-columns:1fr 1fr;background:#ebe6df;border-radius:999px;padding:3px;margin-bottom:20px}
.login-tab{border:0;border-radius:999px;background:transparent;padding:9px 12px;font-size:12px;color:#6d655f}
.login-tab.active{background:#fff;color:#171515;box-shadow:0 1px 7px rgba(0,0,0,.07)}
.login-field{display:block;margin:13px 0}
.login-field span{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6e655f;margin:0 0 7px}
.login-field input{width:100%;height:45px;border:1px solid #d8d0c8;border-radius:12px;background:rgba(255,255,255,.78);outline:0;padding:0 13px;transition:border-color .15s ease,box-shadow .15s ease}
.login-field input:focus{border-color:#a9918d;box-shadow:0 0 0 3px rgba(216,95,109,.10)}
.login-name-field{display:none}
.login-card[data-mode="create"] .login-name-field{display:block}
.login-submit{width:100%;border:0;border-radius:999px;padding:12px 18px;margin-top:7px;background:rgb(var(--aura-rgb,216,95,109));color:var(--aura-button-ink,#fff);font-weight:700;box-shadow:0 8px 24px rgba(var(--aura-rgb,216,95,109),.22)}
.login-submit:disabled{opacity:.62;cursor:wait}
.login-under{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px}
.login-link{border:0;background:none;padding:0;font-size:11px;color:#675e58;text-decoration:underline;text-underline-offset:3px}
.login-message{min-height:18px;font-size:11px;margin:13px 0 0;color:#8a3f49}
.login-message.ok{color:#47664e}
