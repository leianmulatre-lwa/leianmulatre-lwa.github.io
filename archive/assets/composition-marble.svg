<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <filter id="marble" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".026 .052" numOctaves="4" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        7 0 0 0 -3.15
        0 7 0 0 -3.15
        0 0 7 0 -3.15
        0 0 0 1 0" result="threshold"/>
      <feDisplacementMap in="threshold" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="720" height="480" fill="#fff" filter="url(#marble)"/>
</svg>
