<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Big LWA</title>
  <script>
    // GitHub Pages serves this file for extensionless routes such as /login.
    // Keep one canonical login implementation so the route cannot drift.
    const route = window.location.pathname.replace(/\/+$/, "");
    if (route === "/login" || route === "/room") {
      window.location.replace("/?route=" + route.slice(1));
    }
  </script>
</head>
<body>
  <p><a href="/">Return to Big LWA</a></p>
</body>
</html>
