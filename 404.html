<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIGLWA</title></head><body><script>
(async()=>{
  try{
    const response=await fetch('/index.html?biglwa-spa-shell=1',{cache:'no-store'});
    if(!response.ok)throw new Error('shell '+response.status);
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:2rem"><h1>BIGLWA</h1><p>Loading failed. Refresh to try again.</p></main>';
    console.error(error);
  }
})();
</script></body></html>
