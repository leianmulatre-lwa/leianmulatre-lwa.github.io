name = "biglwa-instagram-api"
main = "cloudflare-worker-instagram.js"
compatibility_date = "2026-09-11"
# Preserve dashboard-managed values when deploying a Worker version.
# In particular, a newly rotated TikTok client secret must never be replaced by
# a repository deploy. Secret values are never committed to GitHub.
keep_vars = true

# Intended production bindings. Cloudflare's currently active deployment
# (verified 2026-11-06) is *static-assets-only* and exposes neither these bindings
# nor the encrypted OAuth secrets. Do not interpret this file as proof they are live.
# A bare `wrangler deploy worker.js` or deployment without required secrets could
# remove OAuth state and media access. Restore the real API Worker carefully;
# see docs/runbooks/cloudflare-oauth-worker-recovery.md.
[vars]
INSTAGRAM_APP_ID = "1071153952301247"
PINTEREST_APP_ID = "1610773"
SITE_URL = "https://biglwa.com"
TIKTOK_CLIENT_KEY = "sbawpulijhor3jl94n"
X_CLIENT_ID = "TzRHMHR4VG1XekZ0UGw1cF1Eb0M6MTpjaQ"
NEW_ORBIT_CALLBACK_ORIGIN = "https://api.biglwa.com"

[[kv_namespaces]]
binding = "OAUTH_SESSIONS"
id = "e438b6eecb074f428d8a7f92122b3ad8"

[[r2_buckets]]
binding = "WALLPAPER_BUCKET"
bucket_name = "wallpaper-bucket"

# INSTAGRAM_APP_SECRET, PINTEREST_APP_SECRET, STATE_SECRET and TIKTOK_CLIENT_SECRET
# stay as encrypted Worker secrets and are not restated here.
# All existing provider credentials are managed as encrypted Cloudflare secrets.
# Wrangler validates these names at deploy time; the actual values remain on Cloudflare.
[secrets]
required = ["INSTAGRAM_APP_SECRET", "PINTEREST_APP_SECRET", "STATE_SECRET", "TIKTOK_CLIENT_SECRET", "SNAPCHAT_CLIENT_SECRET", "TUMBLR_CONSUMER_SECRET", "TUMBLR_CONSUMER_KEY", "X_CLIENT_SECRET", "FACEBOOK_PERSONAL_APP_SECRET"]

# Isolated branch previews. OAuth/media writes remain disabled until dedicated
# test-provider credentials and callback URLs are configured.
[previews.vars]
BIGLWA_PREVIEW = "true"
SITE_URL = "https://biglwa.com"

[[previews.kv_namespaces]]
binding = "OAUTH_SESSIONS"
id = "f804d7d809c749a8a9ac2a79e2255c90"

[[previews.r2_buckets]]
binding = "WALLPAPER_BUCKET"
bucket_name = "biglwa-preview-media"

