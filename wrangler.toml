name = "biglwa-instagram-api"
main = "cloudflare-worker-instagram.js"
compatibility_date = "2026-09-11"
# Preserve dashboard-managed values when deploying a Worker version.
# In particular, a newly rotated TikTok client secret must never be replaced by
# a repository deploy. Secret values are never committed to GitHub.
keep_vars = true

# These bindings mirror what is already live on the Worker. A bare
# `wrangler deploy worker.js` would have removed every one of them, which would
# break OAuth state storage and all media storage at the same time.
[vars]
INSTAGRAM_APP_ID = "1071153952301247"
PINTEREST_APP_ID = "1610773"
SITE_URL = "https://biglwa.com"
TIKTOK_CLIENT_KEY = "sbawpulijhor3jl94n"
X_CLIENT_ID = "TzRHMHR4VG1XekZ0UGw1cF1Eb0M6MTpjaQ"
NEW_ORBIT_CALLBACK_ORIGIN = "https://api.biglwa.com"
FIREBASE_PROJECT_ID = "biglwa"
# Dormant until the dashboard-managed SMTP secrets exist. The sender is allowlisted
# in code; no browser caller can choose a recipient, body, or action URL.
MAILROOM_WORKER_DELIVERY = "true"

[[kv_namespaces]]
binding = "OAUTH_SESSIONS"
id = "e438b6eecb074f428d8a7f92122b3ad8"

[[r2_buckets]]
binding = "WALLPAPER_BUCKET"
bucket_name = "wallpaper-bucket"

[[d1_databases]]
binding = "BIGLWA_ACCOUNT_DB"
database_name = "biglwa-account-sync"
database_id = "3b4880f3-2f2f-40fc-ba21-1c536a7dcad8"

# Queued Firestore mirror edits keep retrying every five minutes, including
# after the browser tab is closed. The cron path is internal to the Worker and
# needs no HTTP secret.
[triggers]
crons = ["*/5 * * * *"]

# INSTAGRAM_APP_SECRET, PINTEREST_APP_SECRET, STATE_SECRET and TIKTOK_CLIENT_SECRET
# stay as encrypted Worker secrets and are not restated here.
# All existing provider credentials are managed as encrypted Cloudflare secrets.
# The optional Firestore mirror reads FIREBASE_SERVICE_ACCOUNT from the Worker
# dashboard. It is deliberately not in the required list because an absent
# service account must not block deployment; the health endpoint reports
# firestoreMirror:false and queued edits stay durable in D1/R2 until it is set.
# The D1 schema is in account-sync-schema.sql. The existing WALLPAPER_BUCKET
# binding stores the R2 snapshots under account-sync/. Wrangler validates the
# required names at deploy time; the actual values remain on Cloudflare.
#
# Member auth email relay secrets (Cloudflare dashboard only, never committed):
#   MAILROOM_SMTP_USER       Titan mailbox user whose password is stored below
#   MAILROOM_SMTP_PASSWORD   Titan mailbox app password
# Optional, with safe defaults already in code:
#   MAILROOM_SMTP_HOST       default smtp.titan.email
#   MAILROOM_SMTP_PORT       default 465 (587 also supported; 25 is blocked)
#   MAILROOM_FROM            defaults to leian@biglwa.com; lwazi@biglwa.com is also approved
# FIREBASE_SERVICE_ACCOUNT is required in production to create Firebase action
# links and read the reviewed developerMailPublished templates, but is not in
# the Wrangler-required list so an absent service account does not block deploys.
[secrets]
required = ["INSTAGRAM_APP_SECRET", "PINTEREST_APP_SECRET", "STATE_SECRET", "TIKTOK_CLIENT_SECRET", "SNAPCHAT_CLIENT_SECRET", "TUMBLR_CONSUMER_SECRET", "TUMBLR_CONSUMER_KEY", "X_CLIENT_SECRET", "FACEBOOK_PERSONAL_APP_SECRET"]

# Isolated branch previews. OAuth/media writes remain disabled until dedicated
# test-provider credentials and callback URLs are configured.
[previews.vars]
BIGLWA_PREVIEW = "true"
SITE_URL = "https://biglwa.com"
MAILROOM_WORKER_DELIVERY = "false"

[[previews.kv_namespaces]]
binding = "OAUTH_SESSIONS"
id = "f804d7d809c749a8a9ac2a79e2255c90"

[[previews.r2_buckets]]
binding = "WALLPAPER_BUCKET"
bucket_name = "biglwa-preview-media"

