<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIGLWA</title></head><body><script>
(async()=>{try{const p=["site-1.txt", "site-2.txt", "site-3.txt", "site-4.txt", "site-5.txt"];const b64=(await Promise.all(p.map(x=>fetch(x).then(r=>r.text())))).join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<main style="font-family:system-ui;padding:2rem"><h1>BIGLWA</h1><p>Loading failed. Refresh to try again.</p></main>';console.error(e)}})();
</script></body></html>
