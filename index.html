    const finalTopbar=`<style id="biglwa-topbar-final">#studioApp .topbar::before{content:none!important;display:none!important}#studioApp .studio-brand-row{display:flex!important;grid-column:1!important;align-items:center!important;justify-content:flex-start!important}#studioApp .topbar{grid-template-columns:minmax(150px,180px) minmax(360px,1fr) minmax(250px,350px)!important;gap:14px!important;align-items:center!important}#studioApp .search-wrap{grid-column:2!important}#studioApp .top-actions{grid-column:3!important}@media(max-width:980px){#studioApp .topbar{grid-template-columns:126px minmax(220px,1fr) minmax(210px,280px)!important}}@media(max-width:720px){#studioApp .topbar{grid-template-columns:94px minmax(0,1fr) auto!important;gap:8px!important}}</style>`;
    const affidavitSection=`<section class="policy-page route-screen" id="affidavitPage" aria-label="BIGLWA Affidavit of Good Faith">
      <div class="policy-shell">

          <p class="policy-kicker">Affidavit of Good Faith</p>
          <h1 class="affidavit-page-title">Good faith has to move in both directions.</h1>
          <p class="policy-lede">BIGLWA is built on a mutual promise: I will do my best to handle people’s stories, identities, creativity, and trust with care—and I expect everyone who enters this space to do the same.</p>

          <h2>My promise as founder</h2>
          <p>I created BIGLWA to educate, preserve culture, expand public understanding, and help protect communities from exploitation. The work may confront difficult histories, powerful institutions, digital harm, anti-Blackness, colorism, queerness, class, technology, and the ways marginalized people are often used before they are protected.</p>
          <p>I will approach that work in good faith. I will make reasonable efforts to distinguish fact from belief, memory, interpretation, opinion, and allegation. I will listen when I am wrong, correct what I can, protect context, and treat testimony as something entrusted to me—not something to exploit. My purpose is not revenge, harassment, misinformation, or public harm. It is truth-telling, education, accountability, healing, cultural preservation, and collective understanding.</p>
          <p>I cannot promise perfection. I can promise that I am genuinely trying my best, that I will remain accountable to the people this platform serves, and that BIGLWA will keep learning as it grows.</p>
          <p class="affidavit-verbatim-signature"><strong>Signed:</strong> Leian Stanley</p>

          <div class="affidavit-mutual-divider" aria-hidden="true"></div>

          <h2>Your promise as a member</h2>
          <p>By participating in BIGLWA, you agree to meet that effort with good faith of your own. Share what you honestly believe to be true. Make reasonable efforts to separate evidence from interpretation, and do not knowingly use this platform to mislead, impersonate, exploit, harass, retaliate against, or endanger another person or community.</p>
          <p>If you submit testimony, documentation, creative work, or a Rights &amp; Likeness report, you affirm that you are the person affected, the creator or rights holder involved, or someone authorized to act on their behalf—and that the information you provide is accurate to the best of your knowledge.</p>
          <p>Good faith does not require agreement, politeness, or silence. It requires honesty, context, accountability, and respect for the humanity of the people whose lives and work appear here. BIGLWA may restrict material or participation that breaks this shared promise.</p>

          <p class="policy-note"><strong>Our shared agreement:</strong> We are allowed to learn, question, disagree, and make mistakes. We are not allowed to knowingly turn another person’s identity, pain, work, or trust into a weapon.</p>
          <nav class="policy-links"><a href="/rights" data-policy-route="rights">Rights &amp; Likeness</a><a href="/privacy" data-policy-route="privacy">Privacy</a><a href="/terms" data-policy-route="terms">Terms</a></nav>
        </article>
      </div>
    </section>`;
    html=html.replace(/<section class="policy-page route-screen" id="affidavitPage"[\s\S]*?<\/section>\s*(?=<div class="app-shell route-screen" id="studioApp">)/,affidavitSection+'\n\n  ');
    html=html.replace('<div><b>04 · Escalation can be real</b><p>Depending on the facts, BIGLWA may support takedowns or cease-and-desist correspondence and may coordinate referral to licensed counsel.</p></div>','');
    const affidavitCss=`<style id="biglwa-affidavit-title-size">#affidavitPage .affidavit-page-title{font-size:clamp(30px,4.1vw,48px)!important;line-height:1.02!important;letter-spacing:-1.5px!important;max-width:820px}@media(max-width:620px){#affidavitPage .affidavit-page-title{font-size:28px!important;letter-spacing:-.7px!important}}</style>`;
    html=html.replace(/<button class="diary-page"[^>]*>[\s\S]*?<\/button>/,'<button class="diary-page" data-open="diary" aria-label="Open diary"><img src="/assets/diary-notebook-closeup.svg" alt="Dear diary… on a lined notebook page" width="900" height="600"></button>');
    const diaryCss='<style id="biglwa-widget-notebook">#diary .diary-page{position:relative;display:block;min-height:0;padding:0;border-radius:10px;overflow:hidden;background:transparent!important;box-shadow:0 5px 14px #49342120}#diary .diary-page img{display:block;width:100%;height:auto}</style>';
    html=html.replace('</head>',prepaint+imageCss+affidavitCss+diaryCss+'</head>');
    html=html.replace(/(<article\b[^>]*\bid="projects"[^>]*>)([\s\S]*?)(<\/article>)/,(_,start,contents,end)=>start+contents.replace(/<div class="project-grid">[\s\S]*<\/div>/,'<div class="project-grid" style="grid-template-columns:1fr"><button class="project-tile" data-open="projects" aria-label="Open Projects" style="padding:0;overflow:hidden"><img src="/assets/projects-pink-studio-depth.svg" alt="Bright pink paper backdrop on a concrete studio floor, with one spotlight close and another farther away" width="960" height="640" style="display:block;width:100%;height:auto"></button></div>')+end);
    html=html.replace('</body>',scripts+finalTopbar+'</body>');
    return html;
  };
  const boot=await fetch('/bootstrap-v2.html?v=20260910-mutual-good-faith-2').then(r=>{if(!r.ok)throw new Error('bootstrap '+r.status);return r.text()});
  const m=boot.match(/<script>([\s\S]*?)<\/script>/i);
  if(!m) throw new Error('bootstrap script missing');
