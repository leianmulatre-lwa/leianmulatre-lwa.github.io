          <h1 class="affidavit-page-title">Good faith has to move in both directions.</h1>
          <p class="policy-lede">BIGLWA is built on a mutual promise: I will do my best to handle people’s stories, identities, creativity, and trust with care—and I expect everyone who enters this space to do the same.</p>

          <h2>My promise as founder</h2>
          <p>I created BIGLWA to educate, preserve culture, expand public understanding, and help protect communities from exploitation. The work may confront difficult histories, powerful institutions, digital harm, anti-Blackness, colorism, queerness, class, technology, and the ways marginalized people are often used before they are protected.</p>
