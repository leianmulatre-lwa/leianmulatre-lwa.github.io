name: Build HD Studio cabinet frames with real transparent screens
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_studio_open_screen_pngs.py
      - .github/workflows/studio-open-screens.yml
      - assets/arcade/studio-games-cabinet-hd-20261026.png
      - assets/arcade/studio-lwazi-cabinet-hd-20261026.png
permissions:
  contents: write
jobs:
  build-open-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Make full-resolution transparent screen cutouts
        run: python scripts/build_studio_open_screen_pngs.py
      - name: Publish transparent screen frames
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade/studio-games-cabinet-open-20261026.png assets/arcade/studio-lwazi-cabinet-open-20261026.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish genuine HD transparent Games and Lwazi carousel frames"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
