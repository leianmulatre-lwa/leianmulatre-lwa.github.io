name: Build transparent Studio cabinet PNGs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_studio_cabinet_pngs.py
      - .github/workflows/studio-cabinets-png.yml
permissions:
  contents: write
jobs:
  build-cabinet-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG/AVIF image tools
        run: python -m pip install --quiet pillow pillow-avif-plugin
      - name: Create two fully transparent cabinet PNGs
        run: python scripts/build_studio_cabinet_pngs.py
      - name: Publish PNG files back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade/studio-games-cabinet-20261026.png assets/arcade/studio-lwazi-cabinet-20261026.png
          if ! git diff --cached --quiet; then
            git commit -m "Build two transparent Studio cabinet borders"
            git push origin HEAD:main
          fi
