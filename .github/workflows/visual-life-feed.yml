name: Visual-Life / Werk · reviewed JobSpy snapshot

on:
  # Runs once when the owner changes this reviewed list on main.
  # No cron: scraping is not an on-demand public browser capability.
  push:
    branches: ["main"]
    paths:
      - "data/visual-life/searches.json"
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Job title or skill to search'
        required: true
        default: 'creative director'
        type: string
      location:
        description: 'Location for jobs'
        required: true
        default: 'United States'
        type: string
      source:
        description: 'Original job board'
        type: choice
        options:
          - indeed
          - zip_recruiter
        default: indeed

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-life-feed
  cancel-in-progress: false

jobs:
  reviewed-source-refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify output schema without network
        run: python3 -m unittest discover -s scripts -p test_visual_life_feed.py
      - name: Install local vendored MIT library
        run: pip install --disable-pip-version-check ./werk-main
      - name: Run bounded JobSpy searches (no proxies or API keys)
        env:
          JOB_TERM: ${{ inputs.search_term }}
          JOB_LOCATION: ${{ inputs.location }}
          JOB_SOURCE: ${{ inputs.source }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/visual_life_feed.py --catalog data/visual-life/searches.json
          else
            python3 scripts/visual_life_feed.py --term "$JOB_TERM" --location "$JOB_LOCATION" --source "$JOB_SOURCE" --limit 10
          fi
      - name: Validate feed and commit only source records
        run: |
          python3 -m json.tool data/visual-life/jobs.json > /dev/null
          git add data/visual-life/jobs.json
          if git diff --cached --quiet; then
            echo "No changed feed"
            exit 0
          fi
          git -c user.name="BIG LWA jobs feed" -c user.email="actions@users.noreply.github.com" commit -m "data(visual-life): publish verified JobSpy source results"
          git push origin HEAD:main
          echo "JOBSPY_FEED_UPDATED=1" >> "$GITHUB_ENV"
      # A GITHUB_TOKEN git push does not trigger ordinary push workflows.
      # Workflow dispatch is explicitly exempt, so the new jobs.json reaches Pages.
      - name: Publish updated JobSpy snapshot to GitHub Pages
        if: env.JOBSPY_FEED_UPDATED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
