name: BIG LWA Map workspace checks
on:
  pull_request:
    paths:
      - 'map-app.html'
      - 'lwazi-discovery-extras.js'
      - 'map-lwa-router-20261113.js'
      - 'map-inpage-route-test.mjs'
      - 'lwazi-navigation-map-weather.css'
      - 'map-lwa-experience-20261113.js'
      - 'map-lwa-experience-20261113.css'
      - 'map-workspace-regression-test.mjs'
      - 'module-pages.js'
      - '.github/workflows/map-workspace-checks.yml'
  push:
    branches: [main]
    paths:
      - 'map-app.html'
      - 'lwazi-discovery-extras.js'
      - 'map-lwa-router-20261113.js'
      - 'map-inpage-route-test.mjs'
      - 'lwazi-navigation-map-weather.css'
      - 'map-lwa-experience-20261113.js'
      - 'map-lwa-experience-20261113.css'
      - 'map-workspace-regression-test.mjs'
      - 'module-pages.js'
      - '.github/workflows/map-workspace-checks.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Map and Studio scripts
        run: |
          node --check module-pages.js
          node --check map-lwa-experience-20261113.js
          node --check map-lwa-router-20261113.js
          node --check lwazi-discovery-extras.js
          node --test map-workspace-regression-test.mjs map-inpage-route-test.mjs
      - name: Preserve privacy and Map search contracts
        run: |
          node account-storage-regression-test.mjs
          node --test lwazi/navigation-map-weather.test.mjs
