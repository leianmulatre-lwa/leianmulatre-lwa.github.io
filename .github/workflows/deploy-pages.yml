name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  native-release-check:
    runs-on: ubuntu-24.04
    outputs:
      rebuild: ${{ steps.release.outputs.rebuild }}
      reuse: ${{ steps.release.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -r .tag .github/native-release-lock.json)
          asset=$(jq -r .archive .github/native-release-lock.json)
          if gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/native-assets" && grep -Fxq "$asset" "$RUNNER_TEMP/native-assets"; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          else
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
            # The failed website test did not invalidate these four successful,
            # SHA-pinned Chromium-tested editor jobs from the recovery run.
            # Only reuse their exact artifact IDs and digests while available.
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/45342237858" > "$RUNNER_TEMP/recovery-run.json" &&
               gh api "repos/$GITHUB_REPOSITORY/actions/runs/45342237858/artifacts" > "$RUNNER_TEMP/recovery-artifacts.json" &&
               gh api "repos/$GITHUB_REPOSITORY/actions/runs/45342237858/jobs" > "$RUNNER_TEMP/recovery-jobs.json" &&
               python3 - "$RUNNER_TEMP/recovery-run.json" "$RUNNER_TEMP/recovery-artifacts.json" "$RUNNER_TEMP/recovery-jobs.json" <<'PY'
          import json,sys
          from pathlib import Path
          run, artifacts, jobs = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          assert run['head_sha']=='ee167547c4482194cd2242c55bb856476c4314bd'
          lock=json.loads(Path('.github/native-release-lock.json').read_text())
          assert lock['lightR_sha']=='688c579b3dada389b62c8fad95a024bff1a78564'
          assert lock['source_sha']=='279c52ddbe4d11f3309b331755c7daa08402f12a'
          expected={
            'lightR':(14897453612,'sha256:f16acfe946f5a542feb6ebda8600550e4a780cce502e1c51457117f4064365bc',138268479787),
            'paintR':(14897432443,'sha256:18c7f64096d6a3081c626aedb88f1c91307608c76024d16da2a81aef38b4c453',138268479889),
            'fileR':(14897392255,'sha256:4eb6fdf942efc7ec0317b1dbe42098ef2d33aa9b96e669e3d8f9f7ed7fd5915d',138268479774),
            'keyframeR':(14896837949,'sha256:90ccda0913bd35196729f8a334ac1cd2083963665037c78ed166c5aefada96ca',138268479823)}
          for name,(aid,digest,jid) in expected.items():
              assert any(a['id']==aid and a['name']=='recovered-native-'+name and a['digest']==digest and not a['expired'] for a in artifacts['artifacts'])
              assert any(j['id']==jid and j['conclusion']=='success' for j in jobs['jobs'])
          print('All four previous verified native editor artifacts are available.')
          PY
            then
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
            else
              echo 'reuse=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  rebuild-native:
    needs: native-release-check
    if: needs.native-release-check.outputs.rebuild == 'true' && needs.native-release-check.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: photocraft
            product: lightR
            source: 688c579b3dada389b62c8fad95a024bff1a78564
          - editor: vectorcraft
            product: paintR
            source: 279c52ddbe4d11f3309b331755c7daa08402f12a
          - editor: effectcraft
            product: keyframeR
            source: 279c52ddbe4d11f3309b331755c7daa08402f12a
          - editor: pdfcraft
            product: fileR
            source: 279c52ddbe4d11f3309b331755c7daa08402f12a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/editors/${{ matrix.editor }}
          key: ${{ matrix.editor }}-wasm
      - uses: taiki-e/install-action@v2
        if: matrix.editor != 'effectcraft'
        with:
          tool: trunk
      - if: matrix.editor == 'effectcraft'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Compile original pinned native source
        env:
          EDITOR: ${{ matrix.editor }}
          PRODUCT: ${{ matrix.product }}
          SOURCE_PIN: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          cd "vendor/editors/$EDITOR"
          if [ "$EDITOR" = photocraft ]; then
            cargo test -p photocraft-ui-egui biglwa_lightr_theme_tests --lib
          fi
          if [ "$EDITOR" = effectcraft ]; then
            cargo xtask web
            dest=target/web/dist
          else
            (cd "apps/$EDITOR-web" && trunk build --release)
            dest=dist/web
          fi
          test -s "$dest/index.html"
          find "$dest" -name '*.wasm' -size +0c | grep -q .
          mkdir -p "$dest/upstream-licenses"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dest/upstream-licenses/"
          printf '%s\n' "$PRODUCT BIG LWA customized Rust build at $SOURCE_PIN" 'Original engine by Storytold; original source licenses and notices preserved.' > "$dest/upstream-licenses/SOURCE.txt"
          echo "NATIVE_DIST=$PWD/$dest" >> "$GITHUB_ENV"
      - name: Verify live WASM editor in Chromium
        env:
          PRODUCT: ${{ matrix.product }}
          NODE_PATH: ${{ runner.temp }}/biglwa-playwright/node_modules
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/biglwa-playwright" playwright@1.55.1 --no-audit --no-fund
          "$RUNNER_TEMP/biglwa-playwright/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/native-editor-browser-smoke.cjs "$NATIVE_DIST" "$PRODUCT"
          mkdir -p "$RUNNER_TEMP/recovered-native/build"
          cp -a "$NATIVE_DIST/." "$RUNNER_TEMP/recovered-native/build/"
          cp "$RUNNER_TEMP/biglwa-native-browser-proof/$PRODUCT.json" "$RUNNER_TEMP/recovered-native/proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-native-${{ matrix.product }}
          path: ${{ runner.temp }}/recovered-native/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [native-release-check, rebuild-native]
    if: ${{ !cancelled() && needs.native-release-check.result == 'success' && (needs.rebuild-native.result == 'success' || needs.rebuild-native.result == 'skipped') }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Keep the production browser smoke on the same supported OS as native builds.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Protect Studio loading, thumbnails and search
        run: |
          npm install --prefix /tmp/biglwa-deploy-test jsdom@31.0.1 --no-audit --no-fund
          node --check user-search-results.js
          node --check lwazi-search-ui.js
          node --check lwazi-music-discovery.js
          node --check visual-life-jobs.js
          node --check politc-werk-20261114.js
          node --test politc-werk-test.mjs
          node --check user-search-results.js
          node --check pop-culture-calendar-20261114.js
          node --check werk-browser-window-20261114.js
          node --test werk-lwazi-popcalendar-test.mjs
          node --check lwazi-hair-visuals-20261114.js
          node --check room-discovery-signals-20261114.js
          node --check stream-guide.js
          node --test stream-music-ch05-20261115.test.mjs
          node --test stream-radio-sections-20261115.test.mjs
          node --check stream-radio-world-20261115.js
          node --test stream-radio-world-20261115.test.mjs
          node --test studio-booth-hair-map-room-stream-test.mjs
          node --check studio-booth-preview.js
          node --test booth-thumbnail-board-samples-20261116.test.mjs
          node --check games-wallpaper-rotation-20261118.js
          node --test games-wallpaper-rotation-20261118.test.mjs
          node --check community-profile-roles-20261114.js
          node --test community-profile-policy-regression-20261114.test.mjs
          node --check map-lwa-discovery-20261114.js
          node --test map-discovery-test.mjs
          node --check map-transport-hub-20261114.js
          node --test map-transport-hub-20261114.test.mjs
          node --check map-purposes-20261115.js
          node --check login-archive-player.js
          node --check studio-preview-discord-20261115.js
          node --test map-login-seo-20261115.test.mjs
          node --check google-orbit.js
          node --test orbit-map-provider-regression-20261115.test.mjs
          python3 -m unittest discover -s scripts -p test_visual_life_feed.py
          python3 -m unittest discover -s scripts -p test_visual_life_ats.py
          node --check profile-music.js
          node --check tunes-transfer-20261115.js
          node --test tunes-transfer-20261115.test.mjs
          node --check tools-craft.js
          node --check module-pages.js
          node --check orbit-space-20261114.js
          node --test orbit-space-20261114.test.mjs
          node --check lwazi-link-tools-20261114.js
          node --test lwazi-link-tools-20261114.test.mjs
          node --test free-tools-seo-20261114.test.mjs
          node --test privacy-ads-seo-20261123.test.mjs
          node --check lwazi-discovery-extras.js
          node --test discovery-seo-20261115.test.mjs
          node --check gt6-live-preview-20261118.js
          NODE_PATH=/tmp/biglwa-deploy-test/node_modules node --test gt6-live-preview-seo-20261118.test.mjs
          python3 -m py_compile scripts/refresh-discovery.py
          python3 -m unittest discover -s scripts -p test_refresh_discovery_topics.py
          node --check map-focused.js
          NODE_PATH=/tmp/biglwa-deploy-test/node_modules node --test map-places-auto-fare-20261118.test.mjs
          node --test trophy-skeleton-red-ink-20261118.test.mjs
          node --test calendar-culture-news-profile-20261116.test.mjs
          node --check profile-stats-row-20261116.js
          node --check profile-scoreboard-compact-20261118.js
          python3 -m py_compile .github/scripts/package-recovered-native.py
          node --test profile-scoreboard-widget-20261118.test.mjs
          node --test studio-profile-banner-balance-20261120.test.mjs
          node --test map-first-paint-stable-20261118.test.mjs
          node --test calendar-external-overview-20261118.test.mjs
          node --test werk-source-read-compact-20261118.test.mjs
          node --test login-preview-scoreboard-20261118.test.mjs
          node --check geez-calendar-20261114.js
          node --test geez-calendar-mode-test.mjs
          node booth-vanity-preflight-test.mjs
          node --check pinterest-orbit.js
          node --check stream-guide.js
          node lwazi-search-regression-test.mjs
          node --test lwazi/search-experience.test.mjs lwazi/music-jobs-integration.test.mjs
          node studio-first-paint-rgb-regression-test.mjs
          node studio-myfeed-archive-filmstrip-test.mjs
      - name: Refresh original-source discovery feeds
        run: python3 scripts/refresh-discovery.py
      - name: Download previously verified native builds
        if: needs.native-release-check.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: recovered-native-*
          path: ${{ runner.temp }}/recovered-native
          github-token: ${{ github.token }}
          run-id: 45342237858
      - name: Download freshly rebuilt verified native editors
        if: needs.native-release-check.outputs.rebuild == 'true' && needs.native-release-check.outputs.reuse != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: recovered-native-*
          path: ${{ runner.temp }}/recovered-native
      - name: Restore verified BIG LWA native R editors into public release
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_NATIVE: ${{ needs.native-release-check.outputs.rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          config=".github/native-release-lock.json"
          mkdir -p "$RUNNER_TEMP/native-editors"
          if [ "$REBUILD_NATIVE" = true ]; then
            python3 .github/scripts/package-recovered-native.py "$RUNNER_TEMP/recovered-native" "$RUNNER_TEMP/native-editors" "$config"
            config="$RUNNER_TEMP/native-editors/native-release-lock.json"
          else
            tag=$(jq -r .tag "$config")
            asset=$(jq -r .archive "$config")
            gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/native-editors"
          fi
          asset=$(jq -r .archive "$config")
          expected=$(jq -r .archive_sha256 "$config")
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/native-editors/$asset" | sha256sum --check --status
          BIGLWA_NATIVE_ARCHIVE="$RUNNER_TEMP/native-editors/$asset" python3 .github/scripts/stage-craft-apps.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('bigapps/manifest.json').read_text())
          assert manifest['schema']==1
          routes={'photocraft':'lightR','vectorcraft':'paintR','effectcraft':'keyframeR','pdfcraft':'fileR'}
          for row in manifest['apps']:
              assert row['id'] in routes and row['available'] is True and row.get('build')=='biglwa-native'
              folder=Path('bigapps')/routes[row['id']]
              assert (folder/'index.html').is_file()
              assert any(folder.rglob('*.wasm'))
              assert (folder/'upstream-licenses'/'SOURCE.txt').is_file()
          print('BIG LWA four native R editor builds restored and verified for Pages.')
          PY
      - name: Verify all four restored production editor routes and persist recovery
        if: needs.native-release-check.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/biglwa-playwright/node_modules
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/biglwa-playwright" playwright@1.55.1 --no-audit --no-fund
          "$RUNNER_TEMP/biglwa-playwright/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/native-release-prefixed-smoke.cjs .
          lock="$RUNNER_TEMP/native-editors/native-release-lock.json"
          tag=$(jq -r .tag "$lock")
          asset=$(jq -r .archive "$lock")
          gh release create "$tag" "$RUNNER_TEMP/native-editors/$asset" --target "$GITHUB_SHA" \
            --title "BIG LWA verified native editor recovery" \
            --notes "Rebuilt from original pinned source commits, verified in Chromium and all four production URL prefixes. Original licenses preserved."
          cp "$lock" .github/native-release-lock.json
          git add .github/native-release-lock.json
          git -c user.name="BIG LWA Release Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "release: restore verified native editor archive"
          git push origin HEAD:main
      - name: Package only verified public site files
        run: |
          node --check scripts/performance/build-public-site.mjs
          node scripts/performance/build-public-site.mjs --build > "${RUNNER_TEMP}/biglwa-pages-packaging.json"
          test -f dist/public/index.html
          test -f dist/public/studio/index.html
          test -f dist/public/legal/index.html
          test -f dist/public/map-app.html
          test -f dist/public/bigapps/manifest.json
          # The actual published payload must contain the pending Studio fixes,
          # not merely pass tests against files in the repository.
          grep -Fq 'REAL ★ RANKINGS' dist/public/profile-stats-row-20261116.js
          grep -Fq 'REAL ★ RANK' dist/public/profile-stats-row-20261116.js
          grep -Fq 'biglwa-scoreboard-lights' dist/public/profile-stats-row-20261116.js
          grep -Fq 'scoreboardClock' dist/public/profile-scoreboard-compact-20261118.js
          grep -Fq 'outline:1px dashed rgba(255,255,255,.88)' dist/public/studio-profile-banner-balance-20261120.css
          grep -Fq 'width:min(100%,8ch)' dist/public/studio-profile-banner-balance-20261120.css
          grep -Fq 'Enlarge Aura widget' dist/public/studio-experience.js
          grep -Fq 'Add an avatar through Edit profile' dist/public/avatar-studio-bitmoji-20261017-v3.js
          for entry in index.html studio/index.html 404.html live-studio-shell.html; do
            grep -Fq 'rankstars=20261124-1' "dist/public/$entry"
            grep -Fq 'clock=20261124-1' "dist/public/$entry"
            grep -Fq 'stitch=20261124-1' "dist/public/$entry"
          done
          test ! -e dist/public/third_party
          test ! -e dist/public/.github
          test ! -e dist/public/docs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      # GitHub Pages sometimes cannot discover a freshly uploaded artifact
      # immediately. Rerunning a failed job may produce duplicate artifacts;
      # a new workflow run plus this guard avoids both races.
      - name: Confirm exactly one Pages artifact is registered
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' || echo 0)
            echo "Pages artifact count: ${count} (attempt ${i})"
            if [ "${count}" = "1" ]; then
              sleep 5
              exit 0
            fi
            if [ "${count}" -gt 1 ]; then
              echo "Refusing to deploy ambiguous duplicate Pages artifacts."
              exit 1
            fi
            sleep 3
          done
          echo "Timed out waiting for the Pages artifact to be indexed."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
