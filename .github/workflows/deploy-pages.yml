name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Protect Studio loading, thumbnails and search
        run: |
          node --check user-search-results.js
          node --check lwazi-search-ui.js
          node --check lwazi-music-discovery.js
          node --check visual-life-jobs.js
          node --check profile-music.js
          node --check tools-craft.js
          node --check module-pages.js
          node --check pinterest-orbit.js
          node --check stream-guide.js
          node lwazi-search-regression-test.mjs
          node --test lwazi/search-experience.test.mjs lwazi/music-jobs-integration.test.mjs
          node studio-first-paint-rgb-regression-test.mjs
          node studio-myfeed-archive-filmstrip-test.mjs
      - name: Restore verified BIG LWA native R editors into public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          config=".github/native-release-lock.json"
          tag=$(python3 -c 'import json;print(json.load(open(".github/native-release-lock.json"))["tag"])')
          asset=$(python3 -c 'import json;print(json.load(open(".github/native-release-lock.json"))["archive"])')
          expected=$(python3 -c 'import json;print(json.load(open(".github/native-release-lock.json"))["archive_sha256"])')
          mkdir -p "$RUNNER_TEMP/native-editors"
          gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/native-editors"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/native-editors/$asset" | sha256sum --check --status
          BIGLWA_NATIVE_ARCHIVE="$RUNNER_TEMP/native-editors/$asset" python3 .github/scripts/stage-craft-apps.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('bigapps/manifest.json').read_text())
          assert manifest['schema']==1
          routes={'photocraft':'lightR','vectorcraft':'paintR','effectcraft':'keyframeR','pdfcraft':'fileR'}
          for row in manifest['apps']:
              assert row['id'] in routes and row['available'] is True and row.get('build')=='biglwa-native'
              folder=Path('bigapps')/routes[row['id']]
              assert (folder/'index.html').is_file()
              assert any(folder.rglob('*.wasm'))
              assert (folder/'upstream-licenses'/'SOURCE.txt').is_file()
          print('BIG LWA four native R editor builds restored and verified for Pages.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub Pages sometimes cannot discover a freshly uploaded artifact
      # immediately. Rerunning a failed job may produce duplicate artifacts;
      # a new workflow run plus this guard avoids both races.
      - name: Confirm exactly one Pages artifact is registered
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' || echo 0)
            echo "Pages artifact count: ${count} (attempt ${i})"
            if [ "${count}" = "1" ]; then
              sleep 5
              exit 0
            fi
            if [ "${count}" -gt 1 ]; then
              echo "Refusing to deploy ambiguous duplicate Pages artifacts."
              exit 1
            fi
            sleep 3
          done
          echo "Timed out waiting for the Pages artifact to be indexed."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
