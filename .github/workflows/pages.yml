name: Deploy static content to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify politc, calendar, and site SEO integrity
        run: node site-integrity-test.mjs
      - name: Stage public files without development-only paths
        run: |
          mkdir -p "$RUNNER_TEMP/biglwa-public"
          rsync -a ./ "$RUNNER_TEMP/biglwa-public/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*-test.mjs' \
            --exclude='seo-audits/' \
            --exclude='*.md' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='.DS_Store'
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/biglwa-public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
