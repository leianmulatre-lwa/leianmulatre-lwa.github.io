name: Deploy static content to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify politc, calendar, and site SEO integrity
        run: |
          node site-integrity-test.mjs
          node studio-first-paint-rgb-regression-test.mjs
          node studio-booth-archive-board-selection-test.mjs
      - name: Install DOM test dependency outside public site
        run: npm install --prefix "$RUNNER_TEMP/biglwa-tests" jsdom@26.1.0 --no-audit --no-fund
      - name: Test BIG LWA native creative Workshop
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node tools-workshop-native-test.mjs
      - name: Verify Step Inside native login submission and account creation
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node login-step-inside-regression-test.mjs
      - name: Verify login laptop loads before its programmed cartoon
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node login-laptop-floating-preview-test.mjs
      - name: Verify original toolbar startup, docking, shortcut dragging and recovery
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node toolbar-runtime-regression-test.mjs
      - name: Verify provider followers, per-app badges and stable animated dots
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node studio-verified-followers-test.mjs
      - name: Verify persistent help, color drafts, account analytics and Connect
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node studio-controls-regression-test.mjs
      - name: Verify Likes and monthly Reach reach the banner without Skeleton Key
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node profile-account-metrics-bridge-test.mjs
      - name: Verify persistent Studio layout and safe Settings cache controls
        run: |
          node --check ui-coherence.js
          node --check settings-cache.js
          node --check veve.js
          node studio-layout-cache-test.mjs
          node dock-scroll-stability-test.mjs
          NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node veve-curtain-regression-test.mjs
          NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node stream-dock-no-signal-test.mjs
          node profile-music-test.mjs
          node --check profile-music.js
      - name: Verify Veve, Arcade puzzles, media and board lock integration
        run: |
          node --check veve.js
          node --check pinterest-orbit.js
          node --check feed-polish.js
          node --check module-pages.js
          node orbit-veve-layout-test.mjs
          node privacy-settings-orbit-test.mjs
          node account-storage-regression-test.mjs
          node politc-poster-layout-test.mjs
          node --check writing-collections.js
          node writing-collections-test.mjs
          node --check feed-view.js
          node --check avatar-studio.js
          node --check avatar-studio-bitmoji-20261017-v3.js
          node xbox-sona360-regression-test.mjs
          node xbox-avatar-interaction-regression-test.mjs
          node --check orbit-new-connect-20261017-v5.js
          node --check avatar/minecraft-mannequin.js
          node veve-arcade-regression-test.mjs
          node arcade-silhouette-regression-test.mjs
          node games-arcade-test.mjs
          node arcade-input-loop-regression-test.mjs
          node sqwibz-orbit-routing-test.mjs
          node --check external-link-policy-20261018.js
          node --check arcade/local.js
          node --check orbit-new-connect-20261018-v6.js
          node arcade-preservation-test.mjs
          node facebook-personal-sync-test.mjs
          node preview-isolation-test.mjs
          node orbit-oauth-repair-test.mjs
          node x-oauth-pkce-end-to-end-test.mjs
          node --check avatar/arcade-character.js
          node mii-webport-test.mjs
      - name: Verify imported cards, auth, video trim and accessible media UI
        run: |
          node --check instagram-orbit.js
          node --check session-restore.js
          node --check studio-experience.js
          node --check tools-studio.js
          node --input-type=module --check < tools-craft.js
          node --check tools-video-trim.js
          node feed-auth-tools-regression-test.mjs
          node feed-mixed-caption-test.mjs
          node orbit-badge-layout-test.mjs
          node active-route-build-regression-test.mjs
          node --check studio-account-boundary-20261019.js
          node account-boundary-regression-test.mjs
          node orbit-inline-links-regression-test.mjs
          node pinterest-owned-feed-regression-test.mjs
          node pinterest-recent-board-status-test.mjs
          node boards-compact-journal-regression-test.mjs
          node studio-pinterest-batch-coherence-test.mjs
          node facebook-quicklinks-test.mjs
          node facebook-tiktok-media-test.mjs
          node orbit-provider-feed-end-to-end-test.mjs
          node login-path-and-guide-test.mjs
          node tutorial-symbol-key-test.mjs
          node --check studio-three-bodies-20261019.js
          node three-bodies-skeleton-regression-test.mjs
          node --check section-scroll-assistant-20261020.js
          node politc-scroll-body-regression-test.mjs
          node orbit-session-stability-test.mjs
      - name: Verify username-matched public TikTok and Snapchat lookups
        run: node public-source-username-match-regression-test.mjs
      - name: Verify Instagram and Snapchat story circles sit by Likes on the profile banner
        run: NODE_PATH="$RUNNER_TEMP/biglwa-tests/node_modules" node profile-banner-story-highlights-test.mjs
      - name: Verify Veve Save to Boards, lowercase loader and BIG LWA Workshop
        run: node veve-board-workshop-regression-test.mjs
      - name: Check Veve onboarding, Pinterest and supporter presentation
        run: |
          node --check veve.js
          node --check pinterest-orbit.js
          node --check studio-onboarding.js
          node veve-studio-pinterest-regression-test.mjs
      - name: Validate production native-release archive and fail-closed installer
        run: |
          python3 -m py_compile .github/scripts/stage-craft-apps.py .github/scripts/prepare-native-release.py
          python3 .github/scripts/test-native-release-staging.py
      - name: Stage public files without development-only paths
        run: |
          mkdir -p "$RUNNER_TEMP/biglwa-public"
          rsync -a ./ "$RUNNER_TEMP/biglwa-public/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*-test.mjs' \
            --exclude='seo-audits/' \
            --exclude='*.md' \
            --exclude='*.unitypackage' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='.DS_Store'
      - name: Download activated native editor release if verified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/native-release-lock.json ]; then
            tag="$(python3 -c 'import json;print(json.load(open(".github/native-release-lock.json"))["tag"])')"
            gh release download "$tag" --pattern biglwa-native-editors.tar.gz --dir "$RUNNER_TEMP"
            python3 - <<'PY'
          import hashlib,json,os,pathlib
          lock=json.load(open('.github/native-release-lock.json'))
          filename=pathlib.Path(os.environ['RUNNER_TEMP'])/lock['archive']
          assert filename.exists(), "Pinned native release not downloaded"
          assert hashlib.sha256(filename.read_bytes()).hexdigest()==lock['archive_sha256'], "Native release digest mismatch"
          assert lock['source_sha'] == '279c52ddbe4d11f3309b331755c7daa08402f12a', "Unexpected native release revision"
          print("Verified immutable native Rust production release:",lock['tag'])
          PY
            echo "BIGLWA_NATIVE_ARCHIVE=$RUNNER_TEMP/biglwa-native-editors.tar.gz" >> "$GITHUB_ENV"
          else
            echo "No activated native release yet; keeping existing published editor binaries."
          fi
      - name: Stage verified open-source ArtCraft browser editions
        run: python3 .github/scripts/stage-craft-apps.py "$RUNNER_TEMP/biglwa-public"
      - name: Stage pinned self-hosted Flash emulator
        run: python3 .github/scripts/stage-ruffle.py "$RUNNER_TEMP/biglwa-public"
      - name: Validate ArtCraft staging manifest
        run: |
          python3 -c "import json,pathlib,os; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'biglwa-public/bigapps/manifest.json').read_text()); assert d['schema']==1 and len(d['apps'])==4"
      - name: Verify BIG LWA app URL migration and old bookmarks
        run: python3 .github/scripts/test-bigapps-routing.py
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/biglwa-public
      - name: Wait for Pages artifact indexing
        run: sleep 15
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
