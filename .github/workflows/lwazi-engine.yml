name: Lwazi engine pilot checks

on:
  push:
    branches:
      - feature/lwazi-engine-v1-20261106
    paths:
      - 'lwazi/**'
      - 'lwazi-client.js'
      - 'lwazi-math.js'
      - 'lwazi-math-vision.css'
      - 'lwazi-history.js'
      - 'lwazi-conversation-history.css'
      - 'settings/index.html'
      - 'studio/index.html'
      - '404.html'
      - 'live-studio-shell.html'
      - 'functions/api/lwazi.js'
      - 'user-search-results.js'
      - 'lwazi-music-discovery.js'
      - 'lwazi-music-discovery.css'
      - 'visual-life-jobs.js'
      - 'visual-life-jobs.css'
      - 'profile-music.js'
      - 'tools-craft.js'
      - 'index.html'
      - 'wrangler-lwazi.toml'
      - '.github/workflows/lwazi-engine.yml'
  pull_request:
    paths:
      - 'lwazi/**'
      - 'lwazi-client.js'
      - 'lwazi-math.js'
      - 'lwazi-math-vision.css'
      - 'lwazi-history.js'
      - 'lwazi-conversation-history.css'
      - 'settings/index.html'
      - 'studio/index.html'
      - '404.html'
      - 'live-studio-shell.html'
      - 'functions/api/lwazi.js'
      - 'user-search-results.js'
      - 'lwazi-music-discovery.js'
      - 'lwazi-music-discovery.css'
      - 'visual-life-jobs.js'
      - 'visual-life-jobs.css'
      - 'profile-music.js'
      - 'tools-craft.js'
      - 'index.html'
      - 'wrangler-lwazi.toml'
      - '.github/workflows/lwazi-engine.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check lwazi/policy.mjs
          node --check lwazi/worker.mjs
          node --check lwazi/free-models.mjs
          node --check lwazi-client.js
          node --check lwazi-math.js
          node --check functions/api/lwazi.js
          node --check user-search-results.js
          node --check lwazi-history.js
          node --check lwazi-search-ui.js
          node --check lwazi-music-discovery.js
          node --check visual-life-jobs.js
          node --check profile-music.js
          node --check tools-craft.js
      - name: Engine unit and mocked integration tests
        run: node --test lwazi/worker.test.mjs lwazi/relay.test.mjs lwazi/model-router.test.mjs lwazi/search-experience.test.mjs lwazi/music-jobs-integration.test.mjs lwazi/conversation-search.test.mjs lwazi/fast-answer-latency.test.mjs lwazi/staging-bridge.test.mjs lwazi/modes-history.test.mjs lwazi/math-vision.test.mjs lwazi/vinyl-covers.test.mjs
      - name: Preserve existing Studio search contracts
        run: node lwazi-search-regression-test.mjs
