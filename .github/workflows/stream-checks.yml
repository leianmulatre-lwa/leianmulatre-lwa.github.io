name: Stream programming integration

on:
  pull_request:
    paths:
      - 'discovery-catalog.js'
      - 'discovery-programming-test.mjs'
      - 'assets/discovery/latest.json'
      - 'scripts/refresh-discovery.py'
      - 'scripts/test_refresh_discovery_topics.py'
      - 'data/discovery/topics.json'
      - 'gt6-live-preview-20261118.js'
      - 'gt6-live-preview-seo-20261118.test.mjs'
      - 'gt6-live-preview/**'
      - 'stream-guide.js'
      - 'stream-guide.css'
      - 'stream-guide-test.mjs'
      - 'stream-music-ch05-20261115.test.mjs'
      - 'stream-radio-sections-20261115.test.mjs'
      - 'stream-radio-world-20261115.js'
      - 'stream-radio-world-20261115.css'
      - 'stream-radio-world-20261115.test.mjs'
      - 'assets/radio/college-radio-50-states.json'
      - 'studio-upper-rail-size-contract-20261103.css'
      - 'cloudflare-worker-instagram.js'
      - 'module-pages.js'
      - 'index.html'
      - 'studio/index.html'
      - '404.html'
      - 'live-studio-shell.html'
      - 'lwazi-discovery-extras.js'
      - 'sitemap.xml'
      - 'about/index.html'
      - 'discover/index.html'
      - 'online-games/index.html'
      - 'build-cloudflare-pages.mjs'
      - '.github/workflows/stream-checks.yml'
  push:
    branches: [main]
    paths:
      - 'discovery-catalog.js'
      - 'discovery-programming-test.mjs'
      - 'assets/discovery/latest.json'
      - 'scripts/refresh-discovery.py'
      - 'scripts/test_refresh_discovery_topics.py'
      - 'data/discovery/topics.json'
      - 'gt6-live-preview-20261118.js'
      - 'gt6-live-preview-seo-20261118.test.mjs'
      - 'gt6-live-preview/**'
      - 'stream-guide.js'
      - 'stream-guide.css'
      - 'stream-guide-test.mjs'
      - 'stream-music-ch05-20261115.test.mjs'
      - 'stream-radio-sections-20261115.test.mjs'
      - 'stream-radio-world-20261115.js'
      - 'stream-radio-world-20261115.css'
      - 'stream-radio-world-20261115.test.mjs'
      - 'assets/radio/college-radio-50-states.json'
      - 'studio-upper-rail-size-contract-20261103.css'
      - 'cloudflare-worker-instagram.js'
      - 'module-pages.js'
      - 'index.html'
      - 'studio/index.html'
      - '404.html'
      - 'live-studio-shell.html'
      - 'lwazi-discovery-extras.js'
      - 'sitemap.xml'
      - 'about/index.html'
      - 'discover/index.html'
      - 'online-games/index.html'
      - 'build-cloudflare-pages.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Stream and Worker JavaScript syntax
        run: |
          node --check stream-guide.js
          node --test stream-music-ch05-20261115.test.mjs
          node --test stream-radio-sections-20261115.test.mjs
          node --check stream-radio-world-20261115.js
          node --test stream-radio-world-20261115.test.mjs
          node --check module-pages.js
          node --input-type=module --check < cloudflare-worker-instagram.js
      - name: Check weighted rotation, real audio and Stream interaction
        run: |
          npm install --prefix /tmp/biglwa-discovery-test jsdom@31.0.1
          NODE_PATH=/tmp/biglwa-discovery-test/node_modules node --test discovery-programming-test.mjs
          python3 -m py_compile scripts/refresh-discovery.py
          python3 -m unittest discover -s scripts -p test_refresh_discovery_topics.py
          node --check gt6-live-preview-20261118.js
          NODE_PATH=/tmp/biglwa-discovery-test/node_modules node --test gt6-live-preview-seo-20261118.test.mjs
      - name: Exercise programming submissions and moderation
        run: node stream-guide-test.mjs
      - name: Verify locally hosted Spotify TikTok and YouTube custom players
        run: |
          node stream-media-elements-test.mjs
          for file in assets/media-elements/*-element.js assets/media-elements/media-played-ranges-mixin.js assets/media-elements/loader.js; do node --input-type=module --check < "$file"; done
