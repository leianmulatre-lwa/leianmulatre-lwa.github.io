name: Pages preflight
on:
  pull_request:
    paths:
      - 'index.html'
      - 'about/index.html'
      - 'seo-head.js'
      - 'seo-test.mjs'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'favicon.svg'
      - 'assets/biglwa-social.png'
      - 'feed-mixed-caption-test.mjs'
      - 'feed-view.js'
      - 'orbit-feed.js'
      - 'collective-publish.js'
      - 'pinterest-orbit.js'
      - 'session-restore.js'
      - 'brand-policy.css'
      - 'policy-card-cohesion.js'
      - 'module-pages.js'
      - 'orbit-badge-layout-test.mjs'
      - 'mii-webport-test.mjs'
      - 'studio-layout-cache-test.mjs'
      - 'profile-music-test.mjs'
      - 'profile-music.js'
      - 'studio-experience.js'
      - 'studio-preview.js'
      - 'cloudflare-worker-instagram.js'
      - 'login-path-and-guide-test.mjs'
      - 'tutorial-symbol-key-test.mjs'
      - 'orbit-session-stability-test.mjs'
      - 'instagram-orbit.js'
      - 'cloudflare-worker-instagram.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run the full Pages source verification before merging
        run: |
          node site-integrity-test.mjs
          node seo-test.mjs
          node studio-layout-cache-test.mjs
          node profile-music-test.mjs
          node --check profile-music.js
          node veve-arcade-regression-test.mjs
          node arcade-silhouette-regression-test.mjs
          node mii-webport-test.mjs
          node feed-auth-tools-regression-test.mjs
          node feed-mixed-caption-test.mjs
          node orbit-badge-layout-test.mjs
          node active-route-build-regression-test.mjs
          node orbit-inline-links-regression-test.mjs
          node pinterest-owned-feed-regression-test.mjs
          node login-path-and-guide-test.mjs
          node tutorial-symbol-key-test.mjs
          node orbit-session-stability-test.mjs
          node veve-studio-pinterest-regression-test.mjs
          node --check session-restore.js
          node --check pinterest-orbit.js
          node --check policy-card-cohesion.js
