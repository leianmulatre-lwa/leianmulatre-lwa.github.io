  contents: read
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run the full Pages source verification before merging
        run: |
          node account-storage-regression-test.mjs
          node site-integrity-test.mjs
          node booth-vanity-preflight-test.mjs
          node --check geez-calendar-20261114.js
