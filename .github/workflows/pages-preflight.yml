name: Pages preflight
on:
  pull_request:
    paths:
      - 'index.html'
      - 'account-storage*.js'
      - 'account-storage*.mjs'
      - 'profile-module-sharing.js'
      - 'firestore.rules'
      - 'feed-mixed-caption-test.mjs'
      - 'feed-view.js'
      - 'orbit-feed.js'
      - 'collective-publish.js'
      - 'pinterest-orbit.js'
      - 'session-restore.js'
      - 'studio-interaction-stability.js'
      - 'studio-controls-regression-test.mjs'
      - 'auth-history-tooltip-regression-test.mjs'
      - 'studio/index.html'
      - '404.html'
      - 'brand-policy.css'
      - 'policy-card-cohesion.js'
      - 'module-pages.js'
      - 'community-profile-roles-20261114.js'
      - 'community-profile-roles-20261114.css'
      - 'community-profile-policy-regression-20261114.test.mjs'
      - 'policy-standalone-repair-20261114.css'
      - 'privacy/index.html'
      - 'rights/index.html'
      - 'terms/index.html'
      - 'affidavit/index.html' 
      - 'map-app.html'
      - 'map-lwa-discovery-20261114.js'
      - 'map-lwa-discovery-20261114.css'
      - 'map-discovery-test.mjs'
      - 'map-transport-hub-20261114.js'
      - 'map-transport-hub-20261114.css'
      - 'map-transport-hub-20261114.test.mjs'
      - 'stream-guide.js'
      - 'stream-guide.css'
      - 'booth-room-20261114.css'
      - 'lwazi-hair-visuals-20261114.js'
      - 'lwazi-hair-visuals-20261114.css'
      - 'room-discovery-signals-20261114.js'
      - 'live-studio-payload.html'
      - 'studio-booth-hair-map-room-stream-test.mjs'
      - 'pop-culture-calendar-20261114.js'
      - 'werk-browser-window-20261114.js'
      - 'werk-browser-window-20261114.css'
      - 'user-search-results.js'
      - 'werk-lwazi-popcalendar-test.mjs'
      - 'scripts/visual_life_ats.py'
      - 'scripts/test_visual_life_ats.py'
      - 'data/visual-life/ats-boards.json'
      - 'geez-calendar-20261114.js'
      - 'geez-calendar-20261114.css'
      - 'geez-calendar-mode-test.mjs'
      - 'lwazi-header-series-20261026.css'
      - 'ui-coherence.js'
      - 'booth-vanity-preflight-test.mjs'
      - 'politc-werk-test.mjs'
      - 'scripts/visual_life_feed.py'
      - 'scripts/test_visual_life_feed.py'
      - 'data/visual-life/searches.json'
      - '.github/workflows/visual-life-feed.yml'
      - 'politc-werk-20261114.js'
      - 'politc-werk-20261114.css'
      - 'visual-life-jobs.js'
      - 'module-version-header-20261026.js'
      - 'studio-uploaded-thumbnails-20261110.css'
      - 'project-canvas.js'
      - 'orbit-badge-layout-test.mjs'
      - 'orbit-space-20261114.js'
      - 'orbit-space-20261114.css'
      - 'orbit-space-20261114.test.mjs'
      - 'lwazi-link-tools-20261114.js'
      - 'lwazi-link-tools-20261114.css'
      - 'lwazi-link-tools-20261114.test.mjs'
      - 'free-tools/index.html'
      - 'free-tools-seo-20261114.test.mjs'
      - 'lwazi-discovery-extras.js'
      - 'sitemap.xml'
      - 'about/index.html'
      - 'mii-webport-test.mjs'
      - 'studio-layout-cache-test.mjs'
      - 'profile-music-test.mjs'
      - 'profile-music.js'
      - 'studio-experience.js'
      - 'studio-preview.js'
      - 'cloudflare-worker-instagram.js'
      - 'login-path-and-guide-test.mjs'
      - 'tutorial-symbol-key-test.mjs'
      - 'orbit-session-stability-test.mjs'
      - 'instagram-orbit.js'
      - 'cloudflare-worker-instagram.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run the full Pages source verification before merging
        run: |
          node account-storage-regression-test.mjs
          node site-integrity-test.mjs
          node booth-vanity-preflight-test.mjs
          node --check geez-calendar-20261114.js
          node --test geez-calendar-mode-test.mjs
          node --test politc-werk-test.mjs
          node --check user-search-results.js
          node --check pop-culture-calendar-20261114.js
          node --check werk-browser-window-20261114.js
          node --test werk-lwazi-popcalendar-test.mjs
          node --check lwazi-hair-visuals-20261114.js
          node --check room-discovery-signals-20261114.js
          node --check stream-guide.js
          node --test studio-booth-hair-map-room-stream-test.mjs
          node --check community-profile-roles-20261114.js
          node --test community-profile-policy-regression-20261114.test.mjs
          node --check map-lwa-discovery-20261114.js
          node --test map-discovery-test.mjs
          node --check map-transport-hub-20261114.js
          node --test map-transport-hub-20261114.test.mjs
          python3 -m unittest discover -s scripts -p test_visual_life_feed.py
          python3 -m unittest discover -s scripts -p test_visual_life_ats.py
          node studio-layout-cache-test.mjs
          node profile-music-test.mjs
          node --check profile-music.js
          node veve-arcade-regression-test.mjs
          node arcade-silhouette-regression-test.mjs
          node games-arcade-test.mjs
          node arcade-preservation-test.mjs
          node facebook-personal-sync-test.mjs
          node preview-isolation-test.mjs
          node orbit-oauth-repair-test.mjs
          node mii-webport-test.mjs
          node feed-auth-tools-regression-test.mjs
          node feed-mixed-caption-test.mjs
          node orbit-badge-layout-test.mjs
          node --check orbit-space-20261114.js
          node --test orbit-space-20261114.test.mjs
          node --check lwazi-link-tools-20261114.js
          node --test lwazi-link-tools-20261114.test.mjs
          node --test free-tools-seo-20261114.test.mjs
          node active-route-build-regression-test.mjs
          node orbit-inline-links-regression-test.mjs
          node pinterest-owned-feed-regression-test.mjs
          node login-path-and-guide-test.mjs
          node auth-history-tooltip-regression-test.mjs
          node tutorial-symbol-key-test.mjs
          node orbit-session-stability-test.mjs
          node veve-studio-pinterest-regression-test.mjs
          node --check session-restore.js
          node --check pinterest-orbit.js
          node --check policy-card-cohesion.js
