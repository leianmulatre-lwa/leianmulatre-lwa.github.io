name: Build BIG LWA native paintR, keyframeR and fileR
on:
  push:
    branches: [biglwa-native-editors]
    paths:
      - 'vendor/editors/vectorcraft/**'
      - 'vendor/editors/effectcraft/**'
      - 'vendor/editors/pdfcraft/**'
      - '.github/workflows/build-native-editors.yml'
      - '.github/scripts/native-editor-browser-smoke.cjs'
  workflow_dispatch:

permissions:
  contents: read

# One current build is more valuable than dozens of stale, expensive Rust builds.
concurrency:
  group: native-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: vectorcraft
            product: paintR
          - editor: effectcraft
            product: keyframeR
          - editor: pdfcraft
            product: fileR
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Cache Rust build outputs for each editor
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/editors/${{ matrix.editor }}
          key: ${{ matrix.editor }}-wasm
      - name: Verify source-owned brand assets
        shell: bash
        run: |
          set -euo pipefail
          root="vendor/editors/${{ matrix.editor }}"
          case "${{ matrix.editor }}" in
            vectorcraft) grep -q '0x4594ec' "$root/crates/ui-egui/src/theme.rs";;
            effectcraft)
              grep -q 'Opening keyframeR' "$root/apps/effectcraft-web/web/index.html"
              grep -q '0xb6, 0x79, 0xc5' "$root/crates/ui-egui/src/theme.rs"
              test -s "$root/apps/effectcraft-web/web/favicon.svg";;
            pdfcraft)
              grep -q 'BIG LWA fileR' "$root/crates/ui-egui/src/widgets.rs"
              test -s "$root/assets/biglwa/fileR-mark.svg";;
          esac
      - name: Install Trunk for vector and PDF editors
        if: matrix.editor != 'effectcraft'
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install exact wasm-bindgen CLI for motion editor
        if: matrix.editor == 'effectcraft'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Compile edited native Rust application to browser WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          cd "vendor/editors/${{ matrix.editor }}"
          if [ "${{ matrix.editor }}" = "effectcraft" ]; then
            cargo xtask web
          else
            cd "apps/${{ matrix.editor }}-web"
            trunk build --release
          fi
      - name: Check static editor and preserve upstream licenses
        shell: bash
        run: |
          set -euo pipefail
          source="vendor/editors/${{ matrix.editor }}"
          if [ "${{ matrix.editor }}" = "effectcraft" ]; then
            dest="$source/target/web/dist"
          else
            dest="$source/dist/web"
          fi
          test -s "$dest/index.html"
          find "$dest" -name '*.wasm' -size +0c | grep -q .
          mkdir -p "$dest/upstream-licenses"
          cp "$source/LICENSE-MIT" "$source/LICENSE-APACHE" "$source/NOTICE" "$dest/upstream-licenses/"
          printf '%s\n' 'BIG LWA ${{ matrix.product }} native Rust browser pilot; modified source derived from Storytold ${{ matrix.editor }}.' 'This is an unverified test build and is NOT automatically deployed.' > "$dest/upstream-licenses/SOURCE.txt"
          find "$dest" -name '*.wasm' -exec sha256sum {} \; >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compiled vector/PDF editor for QA, not live deployment
        if: matrix.editor != 'effectcraft'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-wasm-test-${{ github.sha }}
          path: vendor/editors/${{ matrix.editor }}/dist/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload motion editor custom build directory
        if: matrix.editor == 'effectcraft'
        uses: actions/upload-artifact@v4
        with:
          name: keyframeR-motion-wasm-test-${{ github.sha }}
          path: vendor/editors/effectcraft/target/web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install Chromium browser for actual WASM startup verification
        run: |
          npm install --prefix "$RUNNER_TEMP/biglwa-playwright" playwright@1.55.1 --no-audit --no-fund
          "$RUNNER_TEMP/biglwa-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open compiled editor in Chromium and capture proof
        env:
          NODE_PATH: ${{ runner.temp }}/biglwa-playwright/node_modules
        shell: bash
        run: |
          set -euo pipefail
          editor="${{ matrix.editor }}"
          if [ "$editor" = "effectcraft" ]; then
            dist="vendor/editors/$editor/target/web/dist"
          else
            dist="vendor/editors/$editor/dist/web"
          fi
          node --check .github/scripts/native-editor-browser-smoke.cjs
          node .github/scripts/native-editor-browser-smoke.cjs "$dist" "${{ matrix.product }}"
      - name: Upload browser screenshot and runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.product }}-chromium-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/biglwa-native-browser-proof/
          if-no-files-found: warn
          retention-days: 14
